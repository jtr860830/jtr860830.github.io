<h1 id="lab-%E7%92%B0%E5%A2%83%E7%9A%84%E7%9C%9F%E9%9D%A2%E7%9B%AE">Lab 環境的真面目</h1>
<ul>
<li>三台「節點」其實是 Podman Host 上的 <strong>3 個 Container</strong>——<br />
但對 <code>kubectl</code> 來說，它就是一座如假包換的三節點叢集：</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># 在 podman1 上看：節點是 container</span>
$ <span class="hljs-built_in">sudo</span> podman ps --format <span class="hljs-string">&quot;{{.ID}}  {{.Names}}&quot;</span>
b8cefd7accd7  tk8s-control-plane
1f30a94cd82e  tk8s-worker1
9a67c15be3d4  tk8s-worker2
<span class="hljs-comment"># 用 kubectl 看：它就是一座叢集</span>
$ kubectl get nodes
NAME                 STATUS   ROLES           AGE   VERSION
tk8s-control-plane   Ready    control-plane   12d   v1.30.2
tk8s-worker1         Ready    &lt;none&gt;          12d   v1.30.2
tk8s-worker2         Ready    &lt;none&gt;          12d   v1.30.2
</code></pre>
<footer>© 2026 Brobridge Co., Ltd.</footer>

<h1 id="01">01</h1>
<h2 id="%E5%BE%9E-container-%E5%88%B0-kubernetes">從 Container 到 Kubernetes</h2>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="%E8%B3%87%E8%A8%8A%E4%BA%BA%E5%93%A1%E7%9A%84%E4%B8%89%E5%A4%A7%E6%8C%91%E6%88%B0">資訊人員的三大挑戰</h1>
<ol>
<li><strong>應用系統安裝與設定</strong>——human error、強勢主觀 ⋯⋯</li>
<li><strong>弄髒作業系統</strong>——殘留測試帳號、不需存在的 Library ⋯⋯</li>
<li><strong>交接之痛</strong>——人跑了、沒有文件、文件不易閱讀 ⋯⋯</li>
</ol>
<blockquote>
<p>2013 年 Docker 問世，用「軟體貨櫃」的概念改寫了 IT 歷史</p>
</blockquote>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="container-%E7%9A%84%E6%9C%AC%E8%B3%AA%E8%A2%AB%E9%9A%94%E9%9B%A2%E7%9A%84-process">Container 的本質：被隔離的 Process</h1>
<ul>
<li>Container <strong>不是</strong>輕量級 VM，它就是 Host 上的一個 <strong>Process</strong></li>
<li>把行程（Process）與相依檔（Libraries / Binaries）打包，用 Linux 核心功能隔離：</li>
</ul>
<table>
<thead>
<tr>
<th>核心技術</th>
<th>負責什麼</th>
</tr>
</thead>
<tbody>
<tr>
<td>Namespace</td>
<td>隔離視野：PID、網路、主機名、檔案系統 ⋯⋯</td>
</tr>
<tr>
<td>CGroup</td>
<td>限制資源：CPU、記憶體用量</td>
</tr>
<tr>
<td>OverlayFS</td>
<td>分層檔案系統：image 疊層與寫入層</td>
</tr>
</tbody>
</table>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="container-vs-virtual-machine">Container vs. Virtual Machine</h1>
<table>
<thead>
<tr>
<th>比較項目</th>
<th>Container</th>
<th>Virtual Machine</th>
</tr>
</thead>
<tbody>
<tr>
<td>本質</td>
<td>Host 上的隔離 Process</td>
<td>完整虛擬硬體 + Guest OS</td>
</tr>
<tr>
<td>啟動速度</td>
<td>秒級</td>
<td>分鐘級</td>
</tr>
<tr>
<td>資源開銷</td>
<td>共用 Kernel，極低</td>
<td>每台 VM 一套 OS</td>
</tr>
<tr>
<td>映像大小</td>
<td>MB 級</td>
<td>GB 級</td>
</tr>
<tr>
<td>隔離程度</td>
<td>Process 層級</td>
<td>硬體虛擬化層級</td>
</tr>
</tbody>
</table>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="open-container-initiativeoci">Open Container Initiative（OCI）</h1>
<p>Container 不等於 Docker——<strong>OCI 三大標準</strong>讓整個生態系可以互換：</p>
<ul>
<li><strong>Image-spec</strong>：Container Image 的儲存結構（怎麼 Build）</li>
<li><strong>Distribution-spec</strong>：Image 如何推送 / 拉取到 Registry（怎麼 Push/Pull）</li>
<li><strong>Runtime-spec</strong>：如何把 Container 跑起來（生命週期，實作如 <code>runc</code>、<code>crun</code>）</li>
</ul>
<blockquote>
<p>所以 Docker build 的 image，Podman 跑得起來，Kubernetes 也跑得起來</p>
</blockquote>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="oci-%E4%B8%89%E6%A8%99%E6%BA%96%E7%9A%84%E5%AF%A6%E9%9A%9B%E9%81%8B%E4%BD%9C">OCI 三標準的實際運作</h1>
<p><img src="img/oci-flow.png" alt="center" style="height:430px;" /></p>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="docker-%E8%88%87-podman">Docker 與 Podman</h1>
<div class="cols">
<div>
<h3 id="docker">Docker</h3>
<ul>
<li>Client / Server 架構</li>
<li><code>dockerd</code> 常駐 daemon</li>
<li>daemon 掛掉，Container 管理跟著停擺</li>
</ul>
</div>
<div>
<h3 id="podman">Podman</h3>
<ul>
<li>Daemonless，fork/exec 模式</li>
<li>原生支援 rootless</li>
<li>指令與 Docker 幾乎相容</li>
</ul>
</div>
</div>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="%E5%96%AE%E6%A9%9F%E5%B7%A5%E5%85%B7%E7%9A%84%E6%A5%B5%E9%99%90%E7%82%BA%E4%BB%80%E9%BA%BC%E9%9C%80%E8%A6%81-kubernetes">單機工具的極限：為什麼需要 Kubernetes</h1>
<p>Docker / Podman 教會我們打包應用，但它們本質上是<strong>單機工具</strong>：</p>
<ul>
<li>成千上萬個 container 要分佈在不同伺服器上，誰來調度？</li>
<li>節點當機了，上面的 Container 誰來救？</li>
<li>流量進來，誰來分配到多個副本？</li>
<li>尖峰時刻，誰來自動擴展？</li>
</ul>
<blockquote>
<p>Google 把內部大規模調度的經驗做成 <strong>Kubernetes</strong>（希臘文「舵手」），<br />
現已捐給 CNCF 維護</p>
</blockquote>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="%E8%A8%8E%E8%AB%96">討論</h1>
<ul>
<li>為什麼說「Container 不是輕量級 VM」？差在哪？</li>
<li>Dockerfile 解決了三大挑戰中的哪幾個？怎麼解決的？</li>
<li>你的團隊現在用 K8s 解決什麼問題？有哪些是單機 Docker 做不到的？</li>
</ul>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-class="section" data-theme="brobridge" lang="en-US" class="section" data-marpit-pagination="15" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--class:section;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="02">02</h1>
<h2 id="kubernetes-%E6%9E%B6%E6%A7%8B%E7%B8%BD%E8%A6%BD">Kubernetes 架構總覽</h2>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="%E5%8F%A2%E9%9B%86%E7%9A%84%E7%B5%84%E6%88%90control-plane-%E8%88%87-worker-node">叢集的組成：Control Plane 與 Worker Node</h1>
<ul>
<li>K8s 叢集由多台 <strong>Node</strong> 組成，角色分兩種：
<ul>
<li><strong>Control Plane Node</strong>：叢集的大腦——API Server、etcd、Scheduler、Controller-Manager</li>
<li><strong>Worker Node</strong>：真正跑應用的地方——kubelet、kube-proxy、Container Runtime</li>
</ul>
</li>
<li>最小執行單位是 <strong>Pod</strong>：一個 Pod 裡有一個或多個 container</li>
</ul>
<blockquote>
<p>你每天下的 <code>kubectl</code>，第一站永遠是 <strong>API Server</strong></p>
</blockquote>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="%E6%95%B4%E5%BC%B5%E5%9C%B0%E5%9C%96%E6%94%A4%E9%96%8B%E4%BE%86%E7%9C%8B">整張地圖攤開來看</h1>
<p><img src="img/k8s-architecture.png" alt="center" style="height:440px;" /></p>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="api-server%E5%8F%A2%E9%9B%86%E7%9A%84%E5%94%AF%E4%B8%80%E5%85%A5%E5%8F%A3">API Server：叢集的唯一入口</h1>
<ul>
<li>接受所有前端指令：CLI（<code>kubectl</code>）或 UI（Rancher、Dashboard）</li>
<li>每個請求都經過三道關卡：</li>
</ul>
<ol>
<li><strong>Authentication</strong>（身分認證）——你是誰？</li>
<li><strong>Authorization</strong>（授權）——你有什麼權限、可以做什麼？</li>
<li><strong>Admission Control</strong>——請求內容的檢查與處理機制</li>
</ol>
<ul>
<li>所有元件都<strong>只跟 API Server 溝通</strong>，彼此不直接對話</li>
</ul>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="kubeconfig%E4%BD%A0%E6%93%8D%E4%BD%9C%E5%8F%A2%E9%9B%86%E7%9A%84%E8%BA%AB%E5%88%86%E8%AD%89">kubeconfig：你操作叢集的身分證</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ <span class="hljs-built_in">cat</span> ~/.kube/config
apiVersion: v1
clusters:
- cluster:
    server: https://172.22.0.1:6443   <span class="hljs-comment"># API Server 的位置</span>
<span class="hljs-built_in">users</span>:
- name: kubernetes-admin              <span class="hljs-comment"># 你是誰</span>
  user:
    client-certificate-data: ...      <span class="hljs-comment"># 憑證：沒有帳號密碼登入這回事</span>
</code></pre>
<blockquote>
<p>操作 K8s 都是<strong>憑證作業</strong>——你帶著身分證去給大門警衛刷</p>
</blockquote>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="etcd%E5%8F%A2%E9%9B%86%E7%9A%84%E5%94%AF%E4%B8%80%E4%BA%8B%E5%AF%A6%E4%BE%86%E6%BA%90">etcd：叢集的唯一事實來源</h1>
<ul>
<li>分散式 key-value 資料庫，<strong>整個叢集的狀態都存在這</strong>
<ul>
<li>有哪些 Pod、放在哪個 node、Service 設定 ⋯⋯全部都是</li>
</ul>
</li>
<li>使用 <strong>Raft 演算法</strong>選出 Leader，因此節點數必須是<strong>奇數</strong></li>
</ul>
<table>
<thead>
<tr>
<th>etcd 節點數</th>
<th>容錯能力</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>無容錯</td>
</tr>
<tr>
<td>3</td>
<td>壞 1 台照常運作；壞 2 台變<strong>唯讀</strong></td>
</tr>
<tr>
<td>5</td>
<td>壞 2 台照常運作</td>
</tr>
</tbody>
</table>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="scheduler%E6%B1%BA%E5%AE%9A-pod-%E5%8E%BB%E5%93%AA%E5%80%8B-node">Scheduler：決定 Pod 去哪個 Node</h1>
<ul>
<li>監看 API Server 上「還沒分配 node 的 Pod」，幫它挑一個家</li>
<li>不是只看 CPU / 記憶體剩多少，背後有一套演算法，還會考慮：
<ul>
<li><code>nodeSelector</code> / Node Affinity——指定 Pod 要去哪類節點</li>
<li>Pod Affinity / Anti-Affinity——跟誰住、不跟誰住</li>
<li><strong>Taint &amp; Toleration</strong>——節點拒絕誰、Pod 容忍誰</li>
</ul>
</li>
<li>決定之後，把結果<strong>寫回 API Server</strong>（不是直接叫節點做事）</li>
</ul>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="controller-manager%E8%AE%93%E7%8F%BE%E5%AF%A6%E8%BF%BD%E4%B8%8A%E6%9C%9F%E6%9C%9B">Controller-Manager：讓現實追上期望</h1>
<ul>
<li>內含一群 controller，不斷比對「<strong>期望狀態</strong>」與「<strong>實際狀態</strong>」</li>
<li>Pod 掛了？幫你重建回來（但不一定在原來的 node）</li>
<li>副本數不對？多退少補（scale up / down）</li>
<li>應用要進版退版？執行 <strong>Rolling Update</strong>：先建新版 Pod，再刪舊版</li>
</ul>
<blockquote>
<p>這就是 K8s「自我修復」能力的來源——宣告式（Declarative）的核心</p>
</blockquote>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="worker-node-%E4%B8%8A%E7%9A%84%E5%85%A9%E5%80%8B%E5%B8%B8%E9%A7%90%E5%85%B5">Worker Node 上的兩個常駐兵</h1>
<div class="cols">
<div>
<h3 id="kubelet">kubelet</h3>
<ul>
<li>每台 node 一個，負責<strong>生出 Pod</strong></li>
<li>管理 Pod 生命週期</li>
<li>透過 <strong>CRI</strong> 命令 Container Runtime<br />
（主流：<code>containerd</code>）產生 container</li>
</ul>
</div>
<div>
<h3 id="kube-proxy">kube-proxy</h3>
<ul>
<li>讓 Pod 的服務<strong>可以被存取</strong></li>
<li>用 Linux 的 iptables / IPVS 實作 Service</li>
<li>iptables mode：<strong>隨機</strong>挑後端</li>
<li>IPVS mode：<strong>round-robin</strong></li>
</ul>
</div>
</div>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="%E4%B8%89%E5%A4%A7%E9%96%8B%E6%94%BE%E4%BB%8B%E9%9D%A2cricnicsi">三大開放介面：CRI、CNI、CSI</h1>
<p>K8s 不綁定任何廠牌，把「跑 Container、接網路、掛儲存」都定義成標準介面：</p>
<table>
<thead>
<tr>
<th>介面</th>
<th>管什麼</th>
<th>常見實作</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>CRI</strong> Container Runtime Interface</td>
<td>建立 container</td>
<td>containerd、CRI-O</td>
</tr>
<tr>
<td><strong>CNI</strong> Container Network Interface</td>
<td>建立網路</td>
<td>Flannel、Calico、Cilium</td>
</tr>
<tr>
<td><strong>CSI</strong> Container Storage Interface</td>
<td>掛載儲存</td>
<td>Longhorn、NFS、各家儲存設備</td>
</tr>
</tbody>
</table>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="cri-%E7%9A%84%E5%91%BC%E5%8F%AB%E9%8F%88%E5%BE%9E-kubelet-%E5%88%B0-container">CRI 的呼叫鏈：從 kubelet 到 Container</h1>
<p><img src="img/cri-chain.png" alt="center" style="height:400px;" /></p>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="kubectl-apply-%E4%B9%8B%E5%BE%8C%E7%99%BC%E7%94%9F%E4%BA%86%E4%BB%80%E9%BA%BC%E4%BA%8B"><code>kubectl apply</code> 之後，發生了什麼事？</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">kubectl apply -f deploy.yaml
 └─▶ ① API Server：認證 → 授權 → Admission → 寫入 etcd
      └─▶ ② Controller-Manager：看到 Deployment，建立 ReplicaSet → Pod（未分配）
           └─▶ ③ Scheduler：幫 Pod 挑好 node，寫回 API Server
                └─▶ ④ 該 node 的 kubelet：透過 CRI 叫 containerd 拉 image、跑 container
                     └─▶ ⑤ CNI 配好 Pod IP；kube-proxy 更新轉發規則
</code></pre>
<blockquote>
<p>每個箭頭中間都經過 API Server + etcd，元件之間<strong>從不直接溝通</strong></p>
</blockquote>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="pod-%E7%8B%80%E6%85%8B%E9%80%9F%E6%9F%A5%E5%8D%A1%E4%BD%8F%E6%99%82%E5%85%88%E7%9C%8B%E6%98%AF%E5%93%AA%E4%B8%80%E7%AB%99">Pod 狀態速查：卡住時，先看是哪一站</h1>
<table>
<thead>
<tr>
<th>狀態</th>
<th>卡在哪一站</th>
<th>第一個檢查動作</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>Pending</code></td>
<td>Scheduler 排不進去</td>
<td><code>describe</code> 看 Events：資源、nodeSelector、taint</td>
</tr>
<tr>
<td><code>ContainerCreating</code></td>
<td>kubelet / CNI / Volume</td>
<td>Events：image 拉取、PVC 掛載、CNI 配 IP</td>
</tr>
<tr>
<td><code>ImagePullBackOff</code></td>
<td>kubelet 拉不到 image</td>
<td>image 名稱、tag、registry 認證</td>
</tr>
<tr>
<td><code>CrashLoopBackOff</code></td>
<td>Container 起來就死</td>
<td><code>logs --previous</code> 看上一次死前的輸出</td>
</tr>
<tr>
<td><code>OOMKilled</code></td>
<td>超過記憶體 limit</td>
<td><code>describe</code> 看 Last State（第 6 章詳講）</td>
</tr>
</tbody>
</table>
<blockquote>
<p>共同起手式：<code>kubectl describe pod</code> 看 <strong>Events</strong> + <code>kubectl logs</code></p>
</blockquote>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="namespace%E5%8F%A2%E9%9B%86%E8%A3%A1%E7%9A%84%E8%B3%87%E6%BA%90%E9%9A%94%E9%96%93">Namespace：叢集裡的資源隔間</h1>
<ul>
<li>把叢集切成多個<strong>邏輯空間</strong>：<code>default</code>、<code>kube-system</code>、自建的專案空間</li>
<li>大多數資源都<strong>屬於某個 namespace</strong>（Pod、Service、Secret ⋯⋯）
<ul>
<li>Node、PV 這類叢集層級資源<strong>除外</strong></li>
</ul>
</li>
<li>用途：環境隔離（test / prod）、團隊隔離、配額管理（ResourceQuota）</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl get ns
NAME              STATUS   AGE
default           Active   12d     <span class="hljs-comment"># 沒指定 -n 時就在這</span>
kube-system       Active   12d     <span class="hljs-comment"># 系統元件都住這</span>
$ kubectl -n kube-system get pods   <span class="hljs-comment"># 操作別的 namespace 要帶 -n</span>
</code></pre>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-class="lab" data-theme="brobridge" lang="en-US" class="lab" data-marpit-pagination="29" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--class:lab;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="lab-1%E6%8A%8A%E6%9E%B6%E6%A7%8B%E5%9C%96%E5%B0%8D%E6%87%89%E5%88%B0%E7%9C%9F%E5%AF%A6%E5%8F%A2%E9%9B%86">Lab 1：把架構圖對應到真實叢集</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># control plane 元件都以 Pod 形式跑在 kube-system</span>
$ kubectl -n kube-system get pods -o wide
NAME                                         READY   STATUS    ...   NODE
etcd-tk8s-control-plane                      1/1     Running   ...   tk8s-control-plane
kube-apiserver-tk8s-control-plane            1/1     Running   ...   tk8s-control-plane
kube-controller-manager-tk8s-control-plane   1/1     Running   ...   tk8s-control-plane
kube-scheduler-tk8s-control-plane            1/1     Running   ...   tk8s-control-plane
kube-proxy-xxxxx                             1/1     Running   ...   tk8s-worker1

<span class="hljs-comment"># kubelet 不是 Pod，是每台節點上的系統服務</span>
$ <span class="hljs-built_in">sudo</span> podman <span class="hljs-built_in">exec</span> tk8s-worker1 systemctl status kubelet | <span class="hljs-built_in">head</span> -n 3
</code></pre>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="kubernetes-ha-%E6%9E%B6%E6%A7%8B3-%E5%8F%B0-control-plane">Kubernetes HA 架構：3 台 Control Plane</h1>
<p><img src="img/ha-architecture.png" alt="center" style="height:330px;" /></p>
<ul>
<li><strong>kube-vip</strong> 出 VIP、<strong>CM / Scheduler</strong> 選 leader 做事（lease）、<strong>etcd</strong> 靠 Raft 同步</li>
<li>為什麼是 3 台不是 2 台？——受限於 <strong>etcd 要奇數</strong>才能選出 leader</li>
</ul>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="%E8%A8%8E%E8%AB%96-1">討論</h1>
<ul>
<li>在建立 Pod 的過程中，API Server、Scheduler、etcd 各扮演什麼角色？</li>
<li>為什麼 K8s 要把 CRI、CNI、CSI 設計成開放介面，而不是內建？</li>
<li>你的 Pod 卡在 <code>Pending</code>，按照今天的架構圖，你會依序檢查什麼？</li>
</ul>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-class="section" data-theme="brobridge" lang="en-US" class="section" data-marpit-pagination="32" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--class:section;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="03">03</h1>
<h2 id="workload-resources">Workload Resources</h2>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="podk8s-%E7%9A%84%E6%9C%80%E5%B0%8F%E5%9F%B7%E8%A1%8C%E5%96%AE%E4%BD%8D">Pod：K8s 的最小執行單位</h1>
<ul>
<li>一個 Pod = 一個或多個 container + <strong>共用的 network namespace</strong></li>
<li>同 Pod 內：共用<strong>同一個 IP</strong>，彼此用 <code>localhost</code> 溝通（走記憶體，不會斷線）</li>
<li>不同 Pod 之間：<strong>不可能</strong>用 localhost 互通，要走 Pod IP（CNI 負責）</li>
</ul>
<p><img src="img/pod-network.png" alt="center" style="height:280px;" /></p>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-class="lab" data-theme="brobridge" lang="en-US" class="lab" data-marpit-pagination="34" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--class:lab;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="lab-2%E5%BB%BA%E7%AB%8B%E4%B8%A6%E8%A7%80%E5%AF%9F-pod">Lab 2：建立並觀察 Pod</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl run n1 --image=quay.io/cooloo9871/nginx:stable
pod/n1 created

$ kubectl get pods -o wide
NAME   READY   STATUS    RESTARTS   AGE   IP           NODE
n1     1/1     Running   0          10s   10.244.1.5   tk8s-worker1

<span class="hljs-comment"># 刪掉它，會發生什麼事？</span>
$ kubectl delete pod n1
pod <span class="hljs-string">&quot;n1&quot;</span> deleted

$ kubectl get pods
No resources found <span class="hljs-keyword">in</span> default namespace.
</code></pre>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="%E8%A3%B8-pod-%E7%9A%84%E5%95%8F%E9%A1%8C-%E2%86%92-workload-resources">裸 Pod 的問題 → Workload Resources</h1>
<ul>
<li>Workload = 跑在 K8s 上的企業應用，以 <strong>Pod 的形式</strong>存在</li>
<li>但單一 Pod 很脆弱：節點掛了、行程 crash 了，<strong>沒有人幫它重生</strong></li>
<li>所以 K8s 提供 <strong>Workload Resources</strong> 來管理 Pod：</li>
</ul>
<table>
<thead>
<tr>
<th>資源</th>
<th>用途</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Deployment / ReplicaSet</strong></td>
<td>無狀態應用（絕大多數場景）</td>
</tr>
<tr>
<td><strong>StatefulSet</strong></td>
<td>有狀態應用（資料庫等）</td>
</tr>
<tr>
<td><strong>DaemonSet</strong></td>
<td>每台節點都要跑一份的東西</td>
</tr>
<tr>
<td><strong>Job / CronJob</strong></td>
<td>一次性 / 排程任務</td>
</tr>
</tbody>
</table>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="deployment-%E2%86%92-replicaset-%E2%86%92-pod">Deployment → ReplicaSet → Pod</h1>
<ul>
<li><strong>三層關係</strong>，各司其職：
<ul>
<li><strong>Deployment</strong>：管 ReplicaSet——決定副本數、制定<strong>滾動更新規則</strong></li>
<li><strong>ReplicaSet</strong>：管 Pod——Pod 掛了就重建回來</li>
<li><strong>Pod</strong>：真正跑應用</li>
</ul>
</li>
<li>你平常操作的是 Deployment，Pod 是它「孫子輩」的產物</li>
</ul>
<p><img src="img/deployment-rs-pod.png" alt="center" style="height:265px;" /></p>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-class="lab" data-theme="brobridge" lang="en-US" class="lab" data-marpit-pagination="37" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--class:lab;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="lab-3%E9%A9%97%E8%AD%89%E8%87%AA%E6%88%91%E4%BF%AE%E5%BE%A9">Lab 3：驗證自我修復</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl create deployment 2048-dep \
    --image=quay.io/cooloo9871/docker-2048:stable --replicas=2
$ kubectl get pods -o wide
NAME                        READY   STATUS    ...   NODE
2048-dep-84cff4c86-d8q7f    1/1     Running   ...   tk8s-worker1
2048-dep-84cff4c86-x2h9k    1/1     Running   ...   tk8s-worker2

<span class="hljs-comment"># 殺掉一個 Pod，馬上再看</span>
$ kubectl delete pod 2048-dep-84cff4c86-d8q7f
$ kubectl get pods
NAME                        READY   STATUS    RESTARTS   AGE
2048-dep-84cff4c86-x2h9k    1/1     Running   0          2m
2048-dep-84cff4c86-jw6tp    1/1     Running   0          4s   ← 新生的
</code></pre>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="labels--selector%E7%89%A9%E4%BB%B6%E4%B9%8B%E9%96%93%E7%9A%84%E9%BB%8F%E8%91%97%E5%8A%91">Labels &amp; Selector：物件之間的黏著劑</h1>
<ul>
<li>ReplicaSet 怎麼知道哪些 Pod 是它的？——靠 <strong>label</strong></li>
<li>K8s 物件之間的關聯幾乎都是 <strong>selector 比對 label</strong>，不是寫死名字</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-attr">spec:</span>
  <span class="hljs-attr">selector:</span>
    <span class="hljs-attr">matchLabels:</span>
      <span class="hljs-attr">app:</span> <span class="hljs-number">2048</span>          <span class="hljs-comment"># ReplicaSet 認的是這個</span>
  <span class="hljs-attr">template:</span>
    <span class="hljs-attr">metadata:</span>
      <span class="hljs-attr">labels:</span>
        <span class="hljs-attr">app:</span> <span class="hljs-number">2048</span>        <span class="hljs-comment"># 生出來的 Pod 都貼這張標籤</span>
</code></pre>
<blockquote>
<p>下一章的 Service 找後端 Pod，用的也是同一套機制</p>
</blockquote>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="%E6%BB%BE%E5%8B%95%E6%9B%B4%E6%96%B0rolling-update">滾動更新（Rolling Update）</h1>
<ul>
<li>Deployment 的更新策略，預設 <code>RollingUpdate</code>：
<ul>
<li><code>maxSurge</code>：更新過程最多<strong>多長</strong>幾個 Pod</li>
<li><code>maxUnavailable</code>：最多允許幾個 Pod <strong>不可用</strong></li>
</ul>
</li>
<li>先建新版 Pod → 就緒後 → 刪舊版 Pod，服務不中斷</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl <span class="hljs-built_in">set</span> image deploy/2048-dep docker-2048=quay.io/cooloo9871/docker-2048:v2
$ kubectl rollout status deploy/2048-dep    <span class="hljs-comment"># 盯著它換</span>
$ kubectl rollout undo deploy/2048-dep      <span class="hljs-comment"># 出事一鍵退版</span>
</code></pre>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="40" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="%E5%85%B6%E4%BB%96-workload%E5%90%84%E6%9C%89%E5%90%84%E7%9A%84%E4%BB%BB%E5%8B%99">其他 Workload：各有各的任務</h1>
<ul>
<li><strong>DaemonSet</strong>：確保<strong>每台節點</strong>都跑一份副本
<ul>
<li>例：kube-proxy、CNI agent、日誌收集器</li>
</ul>
</li>
<li><strong>StatefulSet</strong>：管理<strong>有狀態</strong>應用
<ul>
<li>Pod 名稱<strong>有序且固定</strong>（<code>db-0</code>、<code>db-1</code>⋯⋯），不是隨機碼</li>
<li>每個 Pod 綁<strong>自己專屬的 PV</strong>；<code>db-0</code> 死了，會用同名同資料重建</li>
<li>搭配 Headless Service 提供固定 DNS 名稱——資料庫的標配</li>
</ul>
</li>
<li><strong>Job</strong>：一次性任務，跑完就結束（例：備份）</li>
<li><strong>CronJob</strong>：排程任務——CronJob 生 Job，Job 生 Pod</li>
</ul>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="%E8%A8%8E%E8%AB%96-2">討論</h1>
<ul>
<li>刪掉一個 Deployment 管的 Pod，它會長回來；那刪掉 <strong>ReplicaSet</strong> 呢？刪掉 <strong>Deployment</strong> 呢？</li>
<li>什麼樣的應用適合 StatefulSet？你的環境裡有嗎？</li>
<li>滾動更新到一半發現新版有 bug，你會下什麼指令？背後發生什麼事？</li>
</ul>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="day-2-%E9%96%8B%E5%A0%B4%E5%BF%AB%E9%80%9F%E5%9B%9E%E9%A1%A7-day-1">Day 2 開場：快速回顧 Day 1</h1>
<ul>
<li><strong>架構</strong>：<code>kubectl</code> → API Server（認證/授權/Admission）→ etcd；<br />
Scheduler 挑節點、Controller-Manager 讓現實追上期望、kubelet 生 Pod</li>
<li><strong>Workload</strong>：Deployment 管 ReplicaSet 管 Pod，label selector 是黏著劑</li>
<li>我們證明了 Pod 會<strong>自我修復</strong>——但也代表 Pod 的 IP 隨時會變</li>
</ul>
<blockquote>
<p>今天的問題：Pod 隨時會被刪掉重建，應用要怎麼<strong>被穩定地找到、把資料留住、活得健康</strong>？</p>
</blockquote>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-class="section" data-theme="brobridge" lang="en-US" class="section" data-marpit-pagination="43" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--class:section;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="04">04</h1>
<h2 id="service-%E8%88%87%E7%B6%B2%E8%B7%AF">Service 與網路</h2>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="44" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="%E5%95%8F%E9%A1%8C%E7%9A%84%E8%B5%B7%E9%BB%9Epod-%E7%9A%84-ip-%E6%9C%83%E8%AE%8A">問題的起點：Pod 的 IP 會變</h1>
<ul>
<li>每個 Pod 有自己的 IP（CNI 分配）</li>
<li>但 Pod 不是一台固定的主機：<strong>每次重建，IP 就換一個</strong></li>
<li>上一章才看過——自我修復、滾動更新，Pod 一直在被刪掉又重建</li>
<li>前端要連後端，IP 一直變，怎麼連？</li>
</ul>
<blockquote>
<p>答案：<strong>Service</strong>——一個不會變的虛擬 IP + 名字，代理一群 Pod</p>
</blockquote>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="45" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="service-%E7%9A%84%E9%81%8B%E4%BD%9C%E5%8E%9F%E7%90%86">Service 的運作原理</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-attr">apiVersion:</span> <span class="hljs-string">v1</span>
<span class="hljs-attr">kind:</span> <span class="hljs-string">Service</span>
<span class="hljs-attr">metadata:</span>
  <span class="hljs-attr">name:</span> <span class="hljs-string">svc-2048</span>
<span class="hljs-attr">spec:</span>
  <span class="hljs-attr">selector:</span>
    <span class="hljs-attr">app:</span> <span class="hljs-number">2048</span>          <span class="hljs-comment"># 用 label 選後端 Pod（又是它！）</span>
  <span class="hljs-attr">ports:</span>
    <span class="hljs-bullet">-</span> <span class="hljs-attr">port:</span> <span class="hljs-number">80</span>
      <span class="hljs-attr">targetPort:</span> <span class="hljs-number">80</span>
</code></pre>
<ul>
<li>Service 持續追蹤符合 selector 的 Pod → 維護 <strong>Endpoints</strong> 清單</li>
<li><strong>kube-proxy</strong> 把「連到 Service IP → 轉發到某個 Pod」寫進 iptables / IPVS</li>
<li>Pod 增減時 Endpoints 自動更新——<strong>流量永遠打到活著的 Pod</strong></li>
</ul>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="46" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="service-%E7%9A%84%E5%85%A8%E8%B2%8C">Service 的全貌</h1>
<p><img src="img/service-flow.png" alt="center" style="height:430px;" /></p>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="47" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="service-%E7%9A%84%E5%9B%9B%E7%A8%AE-type">Service 的四種 Type</h1>
<table>
<thead>
<tr>
<th>Type</th>
<th>存取範圍</th>
<th>用途</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>ClusterIP</strong>（預設）</td>
<td>僅叢集內</td>
<td>服務之間互相呼叫</td>
</tr>
<tr>
<td><strong>NodePort</strong></td>
<td>每台節點開一個 port（30000–32767）</td>
<td>簡單對外、測試</td>
</tr>
<tr>
<td><strong>LoadBalancer</strong></td>
<td>外部 IP</td>
<td>正式對外；<strong>地端要裝 MetalLB / kube-vip</strong></td>
</tr>
<tr>
<td><strong>ExternalName</strong></td>
<td>—</td>
<td>讓 Pod 用 K8s 域名存取<strong>叢集外</strong>的服務</td>
</tr>
</tbody>
</table>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="48" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="dns-%E6%9C%8D%E5%8B%99%E7%99%BC%E7%8F%BE%E7%94%A8%E5%90%8D%E5%AD%97%E6%89%BE%E6%9C%8D%E5%8B%99">DNS 服務發現：用名字找服務</h1>
<ul>
<li>叢集內建 DNS（CoreDNS），每個 Service 自動有一個域名：</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">&lt;service&gt;.&lt;namespace&gt;.svc.cluster.local
   svc-2048.default.svc.cluster.local
</code></pre>
<ul>
<li>同 namespace 直接用 <code>svc-2048</code> 就通；跨 namespace 用 <code>svc-2048.demo</code></li>
<li>所以應用設定檔裡寫的是<strong>服務名字</strong>，不是 IP</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl <span class="hljs-built_in">exec</span> -it n1 -- nslookup svc-2048
Name:   svc-2048.default.svc.cluster.local
Address: 10.98.45.12          <span class="hljs-comment"># ← Service 的 ClusterIP，不會變</span>
</code></pre>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-class="lab" data-theme="brobridge" lang="en-US" class="lab" data-marpit-pagination="49" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--class:lab;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="lab-4%E6%8A%8A-2048-%E7%99%BC%E5%B8%83%E5%87%BA%E5%8E%BB">Lab 4：把 2048 發布出去</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl expose deployment 2048-dep --name=svc-2048 \
    --target-port=80 --<span class="hljs-built_in">type</span>=NodePort
service/svc-2048 exposed

$ kubectl get svc svc-2048
NAME       TYPE       CLUSTER-IP     EXTERNAL-IP   PORT(S)        AGE
svc-2048   NodePort   10.98.45.12    &lt;none&gt;        80:31230/TCP   5s

<span class="hljs-comment"># 從叢集外用「任一台節點 IP:31230」都打得到</span>
$ curl -s http://172.22.0.1:31230 | <span class="hljs-built_in">head</span> -n 3

<span class="hljs-comment"># 刪掉一個 Pod 再打——服務不中斷</span>
$ kubectl delete pod -l app=2048-dep --<span class="hljs-built_in">wait</span>=<span class="hljs-literal">false</span> &amp;&amp; curl -s http://172.22.0.1:31230 | <span class="hljs-built_in">head</span> -n 3
</code></pre>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="50" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="ingress%E4%B8%80%E5%80%8B%E5%85%A5%E5%8F%A3%E8%B7%AF%E7%94%B1%E5%A4%9A%E5%80%8B%E6%9C%8D%E5%8B%99">Ingress：一個入口，路由多個服務</h1>
<ul>
<li>Service 是 <strong>L4</strong>（TCP）；Ingress 是 <strong>L7</strong>（HTTP）——看 <strong>host / path</strong> 分流</li>
<li>需要安裝 <strong>Ingress Controller</strong>（如 Nginx Ingress）才會動作</li>
<li>一個對外 IP 服務多個網站，HTTPS 憑證也能集中在這一層管理</li>
</ul>
<p><img src="img/ingress-routing.png" alt="center" style="height:300px;" /></p>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-class="lab" data-theme="brobridge" lang="en-US" class="lab" data-marpit-pagination="51" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--class:lab;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="lab-5-1%E6%BA%96%E5%82%99-apple--banana-%E5%85%A9%E5%80%8B%E6%9C%8D%E5%8B%99">Lab 5-1：準備 apple / banana 兩個服務</h1>
<div class="cols">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-comment"># apple.yaml —— Pod</span>
<span class="hljs-attr">apiVersion:</span> <span class="hljs-string">v1</span>
<span class="hljs-attr">kind:</span> <span class="hljs-string">Pod</span>
<span class="hljs-attr">metadata:</span>
  <span class="hljs-attr">name:</span> <span class="hljs-string">apple</span>
  <span class="hljs-attr">namespace:</span> <span class="hljs-string">app</span>
  <span class="hljs-attr">labels:</span> {<span class="hljs-attr">app:</span> <span class="hljs-string">apple</span>}
<span class="hljs-attr">spec:</span>
  <span class="hljs-attr">containers:</span>
    <span class="hljs-bullet">-</span> <span class="hljs-attr">name:</span> <span class="hljs-string">apple</span>
      <span class="hljs-attr">image:</span> <span class="hljs-string">hashicorp/http-echo</span>
      <span class="hljs-attr">args:</span> [<span class="hljs-string">&quot;-text=apple&quot;</span>]
</code></pre>
</div>
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-comment"># 同檔以 --- 接著寫 Service</span>
<span class="hljs-meta">---</span>
<span class="hljs-attr">apiVersion:</span> <span class="hljs-string">v1</span>
<span class="hljs-attr">kind:</span> <span class="hljs-string">Service</span>
<span class="hljs-attr">metadata:</span>
  <span class="hljs-attr">name:</span> <span class="hljs-string">apple</span>
  <span class="hljs-attr">namespace:</span> <span class="hljs-string">app</span>
<span class="hljs-attr">spec:</span>
  <span class="hljs-attr">selector:</span> {<span class="hljs-attr">app:</span> <span class="hljs-string">apple</span>}
  <span class="hljs-attr">ports:</span>
    <span class="hljs-bullet">-</span> <span class="hljs-attr">port:</span> <span class="hljs-number">5678</span>
</code></pre>
</div>
</div>
<p>先 <code>kubectl create ns app</code>；banana 一模一樣，把 <code>apple</code> <strong>全部換成</strong> <code>banana</code></p>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-class="lab" data-theme="brobridge" lang="en-US" class="lab" data-marpit-pagination="52" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--class:lab;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="lab-5-2%E5%BB%BA%E7%AB%8B-ingress-%E5%88%86%E6%B5%81%E8%A6%8F%E5%89%87">Lab 5-2：建立 Ingress 分流規則</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-comment"># ingress.yaml ──寫好後：kubectl -n app apply -f ingress.yaml</span>
<span class="hljs-attr">apiVersion:</span> <span class="hljs-string">networking.k8s.io/v1</span>
<span class="hljs-attr">kind:</span> <span class="hljs-string">Ingress</span>
<span class="hljs-attr">metadata:</span> {<span class="hljs-attr">name:</span> <span class="hljs-string">mydemo</span>, <span class="hljs-attr">namespace:</span> <span class="hljs-string">app</span>}
<span class="hljs-attr">spec:</span>
  <span class="hljs-attr">ingressClassName:</span> <span class="hljs-string">nginx</span>
  <span class="hljs-attr">rules:</span>
    <span class="hljs-bullet">-</span> <span class="hljs-attr">host:</span> <span class="hljs-string">my.k8s.org</span>
      <span class="hljs-attr">http:</span>
        <span class="hljs-attr">paths:</span>
          <span class="hljs-bullet">-</span> {<span class="hljs-attr">path:</span> <span class="hljs-string">/apple</span>,  <span class="hljs-attr">pathType:</span> <span class="hljs-string">Prefix</span>, <span class="hljs-attr">backend:</span> {<span class="hljs-attr">service:</span> {<span class="hljs-attr">name:</span> <span class="hljs-string">apple</span>,  <span class="hljs-attr">port:</span> {<span class="hljs-attr">number:</span> <span class="hljs-number">5678</span>}}}}
          <span class="hljs-bullet">-</span> {<span class="hljs-attr">path:</span> <span class="hljs-string">/banana</span>, <span class="hljs-attr">pathType:</span> <span class="hljs-string">Prefix</span>, <span class="hljs-attr">backend:</span> {<span class="hljs-attr">service:</span> {<span class="hljs-attr">name:</span> <span class="hljs-string">banana</span>, <span class="hljs-attr">port:</span> {<span class="hljs-attr">number:</span> <span class="hljs-number">5678</span>}}}}
</code></pre>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-class="lab" data-theme="brobridge" lang="en-US" class="lab" data-marpit-pagination="53" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--class:lab;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="lab-5-3%E6%B8%AC%E8%A9%A6%E5%88%86%E6%B5%81">Lab 5-3：測試分流</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl -n app get ingress
NAME     CLASS   HOSTS        ADDRESS        PORTS
mydemo   nginx   my.k8s.org   172.22.0.100   80

$ curl -H <span class="hljs-string">&quot;host: my.k8s.org&quot;</span> http://172.22.0.100/apple
apple
$ curl -H <span class="hljs-string">&quot;host: my.k8s.org&quot;</span> http://172.22.0.100/banana
banana

<span class="hljs-comment"># 收工：清掉本 Lab 的資源</span>
$ kubectl delete ns app
</code></pre>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>

<h1 id="05">05</h1>
<h2 id="%E8%A8%AD%E5%AE%9A%E8%88%87%E5%84%B2%E5%AD%98">設定與儲存</h2>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="56" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="configmap-%E8%88%87-secret%E8%A8%AD%E5%AE%9A%E8%88%87%E7%A8%8B%E5%BC%8F%E5%88%86%E9%9B%A2">ConfigMap 與 Secret：設定與程式分離</h1>
<ul>
<li>都是「把資料掛進 Pod」的資源，讓同一個 image 跑在不同環境：</li>
</ul>
<div class="cols">
<div>
<h3 id="configmap">ConfigMap</h3>
<ul>
<li><strong>非機敏</strong>設定：參數、設定檔</li>
<li>改設定不用重 build image</li>
</ul>
</div>
<div>
<h3 id="secret">Secret</h3>
<ul>
<li>敏感資訊：密碼、憑證、Token</li>
<li>儲存時做 <strong>base64 編碼</strong></li>
</ul>
</div>
</div>
<p><img src="img/secret-configmap.png" alt="center" style="height:200px;" /></p>
<blockquote>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> base64 是<strong>編碼不是加密</strong>——<code>base64 -d</code> 一秒還原</p>
</blockquote>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-class="lab" data-theme="brobridge" lang="en-US" class="lab" data-marpit-pagination="57" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--class:lab;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="lab-6-1%E6%8A%8A%E5%AF%86%E7%A2%BC%E5%92%8C%E8%A8%AD%E5%AE%9A%E5%AF%AB%E6%88%90-yaml">Lab 6-1：把密碼和設定寫成 YAML</h1>
<div class="cols">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-comment"># secret.yaml —— root 密碼</span>
<span class="hljs-attr">apiVersion:</span> <span class="hljs-string">v1</span>
<span class="hljs-attr">kind:</span> <span class="hljs-string">Secret</span>
<span class="hljs-attr">metadata:</span>
  <span class="hljs-attr">name:</span> <span class="hljs-string">mysql-secrets</span>
  <span class="hljs-attr">namespace:</span> <span class="hljs-string">mysql-system</span>
<span class="hljs-attr">stringData:</span>
  <span class="hljs-attr">MYSQL_ROOT_PASSWORD:</span> <span class="hljs-string">mysqladmin</span>
</code></pre>
</div>
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-comment"># cm.yaml —— 初始化 SQL</span>
<span class="hljs-attr">apiVersion:</span> <span class="hljs-string">v1</span>
<span class="hljs-attr">kind:</span> <span class="hljs-string">ConfigMap</span>
<span class="hljs-attr">metadata:</span>
  <span class="hljs-attr">name:</span> <span class="hljs-string">mysql-init-sql</span>
  <span class="hljs-attr">namespace:</span> <span class="hljs-string">mysql-system</span>
<span class="hljs-attr">data:</span>
  <span class="hljs-attr">init.sql:</span> <span class="hljs-string">|
    CREATE DATABASE test;
</span></code></pre>
</div>
</div>
<p>先 <code>kubectl create ns mysql-system</code>，兩份都 <code>kubectl apply -f</code> 進去</p>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-class="lab" data-theme="brobridge" lang="en-US" class="lab" data-marpit-pagination="58" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--class:lab;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="lab-6-2%E6%8E%9B%E9%80%B2-mysql-deployment">Lab 6-2：掛進 MySQL Deployment</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-comment"># mysql.yaml 的關鍵段落（完整檔見備忘稿）</span>
<span class="hljs-attr">spec:</span>
  <span class="hljs-attr">containers:</span>
    <span class="hljs-bullet">-</span> <span class="hljs-attr">name:</span> <span class="hljs-string">mysql</span>
      <span class="hljs-attr">image:</span> <span class="hljs-string">quay.io/cooloo9871/mysql:8.0</span>
      <span class="hljs-attr">env:</span>
        <span class="hljs-bullet">-</span> <span class="hljs-attr">name:</span> <span class="hljs-string">MYSQL_ROOT_PASSWORD</span>          <span class="hljs-comment"># ① Secret → 環境變數</span>
          <span class="hljs-attr">valueFrom:</span>
            <span class="hljs-attr">secretKeyRef:</span> {<span class="hljs-attr">name:</span> <span class="hljs-string">mysql-secrets</span>, <span class="hljs-attr">key:</span> <span class="hljs-string">MYSQL_ROOT_PASSWORD</span>}
      <span class="hljs-attr">volumeMounts:</span>
        <span class="hljs-bullet">-</span> {<span class="hljs-attr">name:</span> <span class="hljs-string">init-sql</span>, <span class="hljs-attr">mountPath:</span> <span class="hljs-string">/docker-entrypoint-initdb.d</span>}
  <span class="hljs-attr">volumes:</span>
    <span class="hljs-bullet">-</span> <span class="hljs-attr">name:</span> <span class="hljs-string">init-sql</span>                          <span class="hljs-comment"># ② ConfigMap → 掛成檔案</span>
      <span class="hljs-attr">configMap:</span> {<span class="hljs-attr">name:</span> <span class="hljs-string">mysql-init-sql</span>}
</code></pre>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-class="lab" data-theme="brobridge" lang="en-US" class="lab" data-marpit-pagination="59" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--class:lab;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="lab-6-3%E9%83%A8%E7%BD%B2%E4%B8%A6%E9%A9%97%E8%AD%89">Lab 6-3：部署並驗證</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl -n mysql-system apply -f mysql.yaml
$ kubectl -n mysql-system get pod
NAME                     READY   STATUS    RESTARTS   AGE
mysql-54dc664c99-rhtv5   1/1     Running   0          40s

<span class="hljs-comment"># 進去確認 init.sql 有被執行（test 資料庫存在）</span>
$ kubectl -n mysql-system <span class="hljs-built_in">exec</span> -it deploy/mysql -- \
    mysql -uroot -pmysqladmin -e <span class="hljs-string">&quot;SHOW DATABASES;&quot;</span> | grep <span class="hljs-built_in">test</span>
<span class="hljs-built_in">test</span>

<span class="hljs-comment"># 驗證 base64 不是加密</span>
$ kubectl -n mysql-system get secret mysql-secrets \
    -o jsonpath=<span class="hljs-string">&#x27;{.data.MYSQL_ROOT_PASSWORD}&#x27;</span> | <span class="hljs-built_in">base64</span> -d
mysqladmin
</code></pre>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="60" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="%E5%84%B2%E5%AD%98%E7%9A%84%E6%BC%94%E9%80%B2%E5%BE%9E-volume-%E5%88%B0-pv--pvc">儲存的演進：從 Volume 到 PV / PVC</h1>
<ul>
<li>Container 的檔案系統<strong>用過即丟</strong>——Pod 重建，資料歸零 → 資料要掛外部儲存</li>
<li><code>hostPath</code> 綁死節點，Pod 漂走就讀不到 → 要用<strong>不綁節點的儲存</strong>（NFS、SAN ⋯⋯）</li>
<li>總不能要求每個開發者都會連儲存設備 → K8s 把「提供」跟「使用」<strong>拆開</strong>：</li>
</ul>
<table>
<thead>
<tr>
<th>角色</th>
<th>物件</th>
<th>誰負責</th>
</tr>
</thead>
<tbody>
<tr>
<td>提供儲存</td>
<td><strong>PV</strong>（PersistentVolume）</td>
<td>儲存管理者</td>
</tr>
<tr>
<td>申請使用</td>
<td><strong>PVC</strong>（PersistentVolumeClaim）</td>
<td>開發者</td>
</tr>
</tbody>
</table>
<blockquote>
<p>PVC 消耗 PV 資源，就像 <strong>Pod 消耗 Node 資源</strong>——只講需求，不管底層</p>
</blockquote>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="61" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="pv-%E8%88%87-pvc%E5%85%A9%E7%A8%AE%E8%A7%92%E8%89%B2%E7%9A%84%E5%88%86%E5%B7%A5">PV 與 PVC：兩種角色的分工</h1>
<p><img src="img/pv-pvc-pool.png" alt="center" style="height:360px;" /></p>
<ul>
<li><strong>Administrator</strong> 把 PV 註冊進資源池；<strong>Developer</strong> 用 Claim 認領、在 Pod 裡引用</li>
</ul>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="62" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="pvc-%E6%80%8E%E9%BA%BC%E9%85%8D%E5%B0%8D%E5%88%B0-pv">PVC 怎麼配對到 PV？</h1>
<p><img src="img/pvc-pv-matching.png" alt="center" style="height:420px;" /></p>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="63" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="access-modes-%E8%88%87-reclaim-policy">Access Modes 與 Reclaim Policy</h1>
<ul>
<li><strong>Access Mode</strong>——這份儲存可以被怎麼掛載（PVC 與 PV 要對得上）：</li>
</ul>
<table>
<thead>
<tr>
<th>縮寫</th>
<th>全名</th>
<th>意義</th>
<th>典型後端</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>RWO</strong></td>
<td>ReadWriteOnce</td>
<td><strong>單一節點</strong>可讀寫</td>
<td>區塊儲存、local-path</td>
</tr>
<tr>
<td><strong>ROX</strong></td>
<td>ReadOnlyMany</td>
<td>多節點同時<strong>唯讀</strong></td>
<td>NFS、CephFS</td>
</tr>
<tr>
<td><strong>RWX</strong></td>
<td>ReadWriteMany</td>
<td><strong>多節點</strong>同時讀寫</td>
<td>NFS、CephFS</td>
</tr>
<tr>
<td><strong>RWOP</strong></td>
<td>ReadWriteOncePod</td>
<td>全叢集<strong>只准一個 Pod</strong> 讀寫</td>
<td>支援的 CSI driver</td>
</tr>
</tbody>
</table>
<ul>
<li><strong>Reclaim Policy</strong>——PVC 刪掉後：<code>Delete</code> 連資料回收；<code>Retain</code> 留資料等管理者處理</li>
</ul>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-class="lab" data-theme="brobridge" lang="en-US" class="lab" data-marpit-pagination="64" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--class:lab;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="lab-7-1%E6%89%8B%E5%8B%95%E5%BB%BA%E7%AB%8B-local-pv%E9%9D%9C%E6%85%8B%E4%BE%9B%E6%87%89">Lab 7-1：手動建立 Local PV（靜態供應）</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ <span class="hljs-built_in">sudo</span> podman <span class="hljs-built_in">exec</span> tk8s-worker1 <span class="hljs-built_in">mkdir</span> /tmp/mypv &amp;&amp; kubectl create ns persistence
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-comment"># pv.yaml</span>
<span class="hljs-attr">kind:</span> <span class="hljs-string">PersistentVolume</span>
<span class="hljs-attr">apiVersion:</span> <span class="hljs-string">v1</span>
<span class="hljs-attr">metadata:</span> {<span class="hljs-attr">name:</span> <span class="hljs-string">pv-local</span>}
<span class="hljs-attr">spec:</span>
  <span class="hljs-attr">capacity:</span> {<span class="hljs-attr">storage:</span> <span class="hljs-string">10Gi</span>}
  <span class="hljs-attr">accessModes:</span> [<span class="hljs-string">ReadWriteOnce</span>]
  <span class="hljs-attr">local:</span> {<span class="hljs-attr">path:</span> <span class="hljs-string">/tmp/mypv</span>}
  <span class="hljs-attr">nodeAffinity:</span>                <span class="hljs-comment"># Local PV 一定要宣告資料在哪台節點</span>
    <span class="hljs-attr">required:</span>
      <span class="hljs-attr">nodeSelectorTerms:</span>
        <span class="hljs-bullet">-</span> <span class="hljs-attr">matchExpressions:</span> [{<span class="hljs-attr">key:</span> <span class="hljs-string">kubernetes.io/hostname</span>, <span class="hljs-attr">operator:</span> <span class="hljs-string">In</span>, <span class="hljs-attr">values:</span> [<span class="hljs-string">tk8s-worker1</span>]}]
</code></pre>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-class="lab" data-theme="brobridge" lang="en-US" class="lab" data-marpit-pagination="65" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--class:lab;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="lab-7-2%E5%BB%BA%E7%AB%8B-pvc-%E8%AA%8D%E9%A0%98%E5%AE%83">Lab 7-2：建立 PVC 認領它</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-comment"># pvc.yaml</span>
<span class="hljs-attr">kind:</span> <span class="hljs-string">PersistentVolumeClaim</span>
<span class="hljs-attr">apiVersion:</span> <span class="hljs-string">v1</span>
<span class="hljs-attr">metadata:</span> {<span class="hljs-attr">name:</span> <span class="hljs-string">pvc-local</span>, <span class="hljs-attr">namespace:</span> <span class="hljs-string">persistence</span>}
<span class="hljs-attr">spec:</span>
  <span class="hljs-attr">accessModes:</span> [<span class="hljs-string">ReadWriteOnce</span>]
  <span class="hljs-attr">storageClassName:</span> <span class="hljs-string">&quot;&quot;</span>         <span class="hljs-comment"># 留空字串＝不走動態供應</span>
  <span class="hljs-attr">resources:</span>
    <span class="hljs-attr">requests:</span> {<span class="hljs-attr">storage:</span> <span class="hljs-string">10Gi</span>}
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl -n persistence get pvc pvc-local
NAME        STATUS   VOLUME     CAPACITY   ACCESS MODES
pvc-local   Bound    pv-local   10Gi       RWO          ← 配對成功
<span class="hljs-comment"># get pv 那邊也同時變 Bound，CLAIM 欄指向 persistence/pvc-local</span>
</code></pre>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-class="lab" data-theme="brobridge" lang="en-US" class="lab" data-marpit-pagination="66" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--class:lab;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="lab-8-1%E6%8E%9B%E8%BC%89-pvc-%E7%9A%84-deployment">Lab 8-1：掛載 PVC 的 Deployment</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-comment"># deploy.yaml ── kubectl -n persistence apply -f deploy.yaml</span>
<span class="hljs-attr">apiVersion:</span> <span class="hljs-string">apps/v1</span>
<span class="hljs-attr">kind:</span> <span class="hljs-string">Deployment</span>
<span class="hljs-attr">metadata:</span> {<span class="hljs-attr">name:</span> <span class="hljs-string">pod-pvc1-deploy</span>}
<span class="hljs-attr">spec:</span>
  <span class="hljs-attr">selector:</span> {<span class="hljs-attr">matchLabels:</span> {<span class="hljs-attr">app:</span> <span class="hljs-string">pod-pvc1</span>}}
  <span class="hljs-attr">template:</span>
    <span class="hljs-attr">metadata:</span> {<span class="hljs-attr">labels:</span> {<span class="hljs-attr">app:</span> <span class="hljs-string">pod-pvc1</span>}}
    <span class="hljs-attr">spec:</span>
      <span class="hljs-attr">volumes:</span> [{<span class="hljs-attr">name:</span> <span class="hljs-string">pv-storage</span>, <span class="hljs-attr">persistentVolumeClaim:</span> {<span class="hljs-attr">claimName:</span> <span class="hljs-string">pvc-local</span>}}]   <span class="hljs-comment"># ① 引用 PVC</span>
      <span class="hljs-attr">containers:</span>
        <span class="hljs-bullet">-</span> <span class="hljs-attr">name:</span> <span class="hljs-string">pod-pvc1</span>
          <span class="hljs-attr">image:</span> <span class="hljs-string">quay.io/cooloo9871/nginx:stable</span>
          <span class="hljs-attr">volumeMounts:</span> [{<span class="hljs-attr">mountPath:</span> <span class="hljs-string">/usr/share/nginx/html</span>, <span class="hljs-attr">name:</span> <span class="hljs-string">pv-storage</span>}]       <span class="hljs-comment"># ② 掛到路徑</span>
</code></pre>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-class="lab" data-theme="brobridge" lang="en-US" class="lab" data-marpit-pagination="67" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--class:lab;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="lab-8-2%E9%A9%97%E8%AD%89%E8%B3%87%E6%96%99%E8%90%BD%E5%9C%B0">Lab 8-2：驗證資料落地</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl -n persistence get pod -o wide
NAME                               READY   STATUS    ...   NODE
pod-pvc1-deploy-55bd78887d-h2gcn   1/1     Running   ...   tk8s-worker1  ← 被 nodeAffinity 拉過來

<span class="hljs-comment"># 進 Pod 寫一筆資料</span>
$ kubectl -n persistence <span class="hljs-built_in">exec</span> pod-pvc1-deploy-55bd78887d-h2gcn -- \
    sh -c <span class="hljs-string">&quot;echo &#x27;hello world&#x27; &gt; /usr/share/nginx/html/index.html&quot;</span>

<span class="hljs-comment"># 到節點上看：資料真的落在 worker1 的 /tmp/mypv</span>
$ <span class="hljs-built_in">sudo</span> podman <span class="hljs-built_in">exec</span> tk8s-worker1 <span class="hljs-built_in">cat</span> /tmp/mypv/index.html
hello world
</code></pre>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-class="lab" data-theme="brobridge" lang="en-US" class="lab" data-marpit-pagination="68" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--class:lab;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="lab-9pv-%E7%9A%84%E7%94%9F%E5%91%BD%E9%80%B1%E6%9C%9Freleased-%E8%A7%A3%E8%AC%8E">Lab 9：PV 的生命週期——Released 解謎</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># 刪掉 Deployment 跟 PVC，PV 變成 Released（Retain 策略：資料保留）</span>
$ kubectl -n persistence delete deploy/pod-pvc1-deploy pvc/pvc-local
$ kubectl get pv
NAME       RECLAIM POLICY   STATUS     CLAIM
pv-local   Retain           Released   persistence/pvc-local

<span class="hljs-comment"># 重建一模一樣的 PVC——竟然 Pending！</span>
$ kubectl -n persistence get pvc
NAME        STATUS    VOLUME
pvc-local   Pending           ← 為什麼配不上？

<span class="hljs-comment"># 解法：編輯 PV，把殘留的 claimRef 區塊整段刪掉</span>
$ kubectl edit pv pv-local        <span class="hljs-comment"># 刪除 spec.claimRef 整段</span>
<span class="hljs-comment"># → 再看一次 PVC：pvc-local 立刻變成 Bound</span>
</code></pre>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="69" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="storageclass%E8%AE%93-pv-%E8%87%AA%E5%8B%95%E7%94%9F%E5%87%BA%E4%BE%86">StorageClass：讓 PV 自動生出來</h1>
<ul>
<li>手動建 PV（靜態供應）的痛剛剛都體驗過了——PVC 一多就累死</li>
<li><strong>StorageClass 動態供應</strong>：PVC 指定 <code>storageClassName</code>，PV <strong>自動建立</strong>、<br />
1:1 剛好大小、用完自動回收——正是 <strong>CSI</strong> 標準保證的三件事</li>
<li>Lab 叢集裝的是 <strong>Local Path Provisioner</strong>：</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl -n local-path-storage get pod
NAME                                     READY   STATUS
local-path-provisioner-c7796694c-45fwd   1/1     Running    ← 它也是個 Pod

$ kubectl get storageclass
NAME         PROVISIONER             RECLAIMPOLICY   VOLUMEBINDINGMODE
local-path   rancher.io/local-path   Delete          WaitForFirstConsumer
</code></pre>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-class="lab" data-theme="brobridge" lang="en-US" class="lab" data-marpit-pagination="70" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--class:lab;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="lab-10-1%E5%8B%95%E6%85%8B%E4%BE%9B%E6%87%89%E7%9A%84-pvc-%E8%88%87-pod">Lab 10-1：動態供應的 PVC 與 Pod</h1>
<div class="cols">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-comment"># pvc.yaml</span>
<span class="hljs-attr">apiVersion:</span> <span class="hljs-string">v1</span>
<span class="hljs-attr">kind:</span> <span class="hljs-string">PersistentVolumeClaim</span>
<span class="hljs-attr">metadata:</span>
  <span class="hljs-attr">name:</span> <span class="hljs-string">html-storage</span>
  <span class="hljs-attr">namespace:</span> <span class="hljs-string">persistence</span>
<span class="hljs-attr">spec:</span>
  <span class="hljs-attr">storageClassName:</span> <span class="hljs-string">local-path</span>
  <span class="hljs-attr">accessModes:</span> [<span class="hljs-string">ReadWriteOnce</span>]
  <span class="hljs-attr">resources:</span>
    <span class="hljs-attr">requests:</span> {<span class="hljs-attr">storage:</span> <span class="hljs-string">3Mi</span>}
</code></pre>
</div>
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-comment"># nginx-pvc.yaml</span>
<span class="hljs-attr">apiVersion:</span> <span class="hljs-string">v1</span>
<span class="hljs-attr">kind:</span> <span class="hljs-string">Pod</span>
<span class="hljs-attr">metadata:</span>
  <span class="hljs-attr">name:</span> <span class="hljs-string">nginx</span>
  <span class="hljs-attr">namespace:</span> <span class="hljs-string">persistence</span>
<span class="hljs-attr">spec:</span>
  <span class="hljs-attr">containers:</span>
    <span class="hljs-bullet">-</span> <span class="hljs-attr">name:</span> <span class="hljs-string">nginx</span>
      <span class="hljs-attr">image:</span> <span class="hljs-string">quay.io/cooloo9871/nginx:stable</span>
      <span class="hljs-attr">volumeMounts:</span>
        <span class="hljs-bullet">-</span> {<span class="hljs-attr">name:</span> <span class="hljs-string">html</span>, <span class="hljs-attr">mountPath:</span> <span class="hljs-string">/usr/share/nginx/html</span>}
  <span class="hljs-attr">volumes:</span>
    <span class="hljs-bullet">-</span> {<span class="hljs-attr">name:</span> <span class="hljs-string">html</span>, <span class="hljs-attr">persistentVolumeClaim:</span> {<span class="hljs-attr">claimName:</span> <span class="hljs-string">html-storage</span>}}
</code></pre>
</div>
</div>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-class="lab" data-theme="brobridge" lang="en-US" class="lab" data-marpit-pagination="71" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--class:lab;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="lab-10-2%E8%A7%80%E5%AF%9F%E5%85%A8%E6%B5%81%E7%A8%8B">Lab 10-2：觀察全流程</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># 只建 PVC——先 Pending 是正常的！</span>
$ kubectl -n persistence get pvc html-storage
NAME           STATUS    VOLUME   STORAGECLASS
html-storage   Pending            local-path     ← WaitForFirstConsumer

<span class="hljs-comment"># 建立掛載它的 nginx Pod → PV 自動生出來、PVC 變 Bound</span>
$ kubectl -n persistence get pvc,pv
pvc/html-storage    Bound   pvc-9b975828-…   3Mi   local-path
pv/pvc-9b975828-…   3Mi     Delete   Bound   persistence/html-storage

<span class="hljs-comment"># 刪 Pod + PVC → PV 與節點上的資料一起消失（Delete 回收策略）</span>
$ kubectl -n persistence delete po/nginx pvc/html-storage
$ kubectl get pv
No resources found
</code></pre>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-class="lab" data-theme="brobridge" lang="en-US" class="lab" data-marpit-pagination="72" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--class:lab;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="lab-11%E8%B3%87%E6%96%99%E6%B0%B8%E5%AD%98%E7%9A%84%E6%9C%80%E7%B5%82%E9%A9%97%E8%AD%89">Lab 11：資料永存的最終驗證</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># 重建 PVC + Pod，寫入資料</span>
$ kubectl -n persistence <span class="hljs-built_in">exec</span> nginx -- \
    sh -c <span class="hljs-string">&#x27;echo hello-pv &gt; /usr/share/nginx/html/index.html&#x27;</span>

<span class="hljs-comment"># 只刪 Pod（PVC 留著）→ 重建 Pod → 資料還在</span>
$ kubectl -n persistence delete pod nginx &amp;&amp; kubectl apply -f nginx-pvc.yaml
$ kubectl -n persistence <span class="hljs-built_in">exec</span> nginx -- <span class="hljs-built_in">cat</span> /usr/share/nginx/html/index.html
hello-pv
</code></pre>
<ul>
<li>對照第 3 章的裸 Pod：<strong>Pod 隨時可以刪掉重建，資料交給 PV 保管</strong></li>
</ul>

<h1 id="metrics-server%E5%8F%A2%E9%9B%86%E7%9A%84%E9%AB%94%E9%87%8D%E8%A8%88">Metrics Server：叢集的體重計</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl top nodes
NAME                 CPU(cores)   CPU(%)   MEMORY(bytes)   MEMORY(%)
tk8s-control-plane   1072m        26%      904Mi           5%
tk8s-worker1         156m         3%       1220Mi          7%

$ kubectl top pods
NAME                        CPU(cores)   MEMORY(bytes)
2048-dep-84cff4c86-x2h9k    1m           18Mi
</code></pre>
<ul>
<li>CPU 單位 <strong>m</strong>（milli-core）：<code>1000m</code> = 1 顆核心</li>
<li>HPA（本章結尾）就是靠這些數據做決策</li>
