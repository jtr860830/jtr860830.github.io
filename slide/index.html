</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="77" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="76" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="resource-requests-%E8%88%87-limits">Resource Requests 與 Limits</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-attr">resources:</span>
  <span class="hljs-attr">requests:</span>          <span class="hljs-comment"># 「我至少需要」→ Scheduler 排程的依據</span>
    <span class="hljs-attr">memory:</span> <span class="hljs-string">&quot;128Mi&quot;</span>
    <span class="hljs-attr">cpu:</span> <span class="hljs-string">&quot;250m&quot;</span>
  <span class="hljs-attr">limits:</span>            <span class="hljs-comment"># 「我最多能用」→ Kernel 執行的上限</span>
    <span class="hljs-attr">memory:</span> <span class="hljs-string">&quot;256Mi&quot;</span>
    <span class="hljs-attr">cpu:</span> <span class="hljs-string">&quot;500m&quot;</span>
</code></pre>
<ul>
<li><strong>requests 給 Scheduler 看</strong>：節點剩的資源夠不夠放這個 Pod</li>
<li><strong>limits 給 Linux Kernel 看</strong>：CGroup 強制執行
<ul>
<li>記憶體超過 limit → <strong>OOMKilled</strong></li>
<li>CPU 超過 limit → <strong>Throttling</strong>（被掐住變慢，不會死）</li>
</ul>
</li>
</ul>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="78" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-class="lab" data-theme="brobridge" lang="en-US" class="lab" data-marpit-pagination="77" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--class:lab;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="lab-12-1%E6%BA%96%E5%82%99%E4%B8%80%E5%80%8B%E6%9C%89-limits-%E7%9A%84-pod">Lab 12-1：準備一個有 limits 的 Pod</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-comment"># resource.yaml</span>
<span class="hljs-attr">apiVersion:</span> <span class="hljs-string">v1</span>
<span class="hljs-attr">kind:</span> <span class="hljs-string">Pod</span>
<span class="hljs-attr">metadata:</span> {<span class="hljs-attr">name:</span> <span class="hljs-string">podres</span>}
<span class="hljs-attr">spec:</span>
  <span class="hljs-attr">containers:</span>
    <span class="hljs-bullet">-</span> <span class="hljs-attr">name:</span> <span class="hljs-string">podres</span>
      <span class="hljs-attr">image:</span> <span class="hljs-string">quay.io/cooloo9871/alp.base:stable</span>
      <span class="hljs-attr">resources:</span>
        <span class="hljs-attr">requests:</span> {<span class="hljs-attr">memory:</span> <span class="hljs-string">128Mi</span>, <span class="hljs-attr">cpu:</span> <span class="hljs-string">250m</span>}
        <span class="hljs-attr">limits:</span>   {<span class="hljs-attr">memory:</span> <span class="hljs-string">256Mi</span>, <span class="hljs-attr">cpu:</span> <span class="hljs-string">500m</span>}   <span class="hljs-comment"># 記憶體上限 256Mi</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl apply -f resource.yaml     <span class="hljs-comment"># 起來後 kubectl get pod 應為 Running</span>
</code></pre>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="79" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-class="lab" data-theme="brobridge" lang="en-US" class="lab" data-marpit-pagination="78" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--class:lab;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="lab-12-2%E8%A7%B8%E7%99%BC-oomkilled">Lab 12-2：觸發 OOMKilled</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># 用 stress-ng 吃 280Mi（超過 256Mi 的 limit）</span>
$ kubectl <span class="hljs-built_in">exec</span> podres -- stress-ng --vm 1 --vm-bytes 280M --vm-hang 5 --<span class="hljs-built_in">timeout</span> 6s
<span class="hljs-built_in">command</span> terminated with <span class="hljs-built_in">exit</span> code 137

$ kubectl get pod podres
NAME     READY   STATUS      RESTARTS     AGE
podres   0/1     OOMKilled   1 (5s ago)   1m

<span class="hljs-comment"># describe 看得到死因</span>
$ kubectl describe pod podres | grep -A2 <span class="hljs-string">&quot;Last State&quot;</span>
    Last State:     Terminated
      Reason:       OOMKilled
      Exit Code:    137
</code></pre>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="80" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="79" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="qos%E8%B3%87%E6%BA%90%E4%B8%8D%E5%A4%A0%E6%99%82%E8%AA%B0%E5%85%88%E8%A2%AB%E8%B6%95%E8%B5%B0">QoS：資源不夠時，誰先被趕走？</h1>
<p>節點記憶體吃緊時，K8s 依 <strong>QoS Class</strong> 決定驅逐（Eviction）順序：</p>
<table>
<thead>
<tr>
<th>QoS Class</th>
<th>條件</th>
<th>被趕走的順序</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Guaranteed</strong></td>
<td>所有 Container requests = limits</td>
<td>最後</td>
</tr>
<tr>
<td><strong>Burstable</strong></td>
<td>有設 requests 但 ≠ limits</td>
<td>中間</td>
</tr>
<tr>
<td><strong>BestEffort</strong></td>
<td>什麼都沒設</td>
<td><strong>最先</strong></td>
</tr>
</tbody>
</table>
<blockquote>
<p>重要服務設成 Guaranteed，是生產環境的基本功</p>
</blockquote>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="81" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="80" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="%E5%81%A5%E5%BA%B7%E6%AA%A2%E6%9F%A5k8s-%E6%80%8E%E9%BA%BC%E7%9F%A5%E9%81%93%E4%BD%A0%E7%9A%84%E6%87%89%E7%94%A8%E9%82%84%E6%B4%BB%E8%91%97">健康檢查：K8s 怎麼知道你的應用還活著？</h1>
<ul>
<li>Container 的行程沒死 ≠ 應用還健康（死鎖、連不上 DB ⋯⋯）</li>
<li>三種 <strong>Probe</strong> 讓 kubelet 主動探測：</li>
</ul>
<table>
<thead>
<tr>
<th>Probe</th>
<th>問題</th>
<th>失敗的後果</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Liveness</strong></td>
<td>你還活著嗎？</td>
<td><strong>重啟</strong> container</td>
</tr>
<tr>
<td><strong>Readiness</strong></td>
<td>你可以接流量了嗎？</td>
<td>從 Service <strong>Endpoints 移除</strong>（不重啟）</td>
</tr>
<tr>
<td><strong>Startup</strong></td>
<td>你啟動完成了嗎？</td>
<td>啟動期間先不做上面兩種檢查</td>
</tr>
</tbody>
</table>
<footer>© 2026 Brobridge Co., Ltd.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="82" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="81" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="hpa%E8%AE%93%E5%89%AF%E6%9C%AC%E6%95%B8%E8%87%AA%E5%8B%95%E8%B7%9F%E4%B8%8A%E6%B5%81%E9%87%8F">HPA：讓副本數自動跟上流量</h1>
<ul>
<li><strong>Horizontal Pod Autoscaler</strong>：依 metrics 自動調整 Deployment 副本數</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ kubectl autoscale deploy hpa-dep --cpu-percent=30 --min=2 --max=10

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="84" data-paginate="true" data-footer="© 2026 Brobridge Co., Ltd." data-theme="brobridge" lang="en-US" data-marpit-pagination="83" style="--paginate:true;--footer:© 2026 Brobridge Co., Ltd.;--theme:brobridge;" data-marpit-pagination-total="83">
<h1 id="%E7%B8%BD%E7%B5%90%E6%8A%8A%E9%80%99%E5%85%A9%E5%A4%A9%E7%9A%84%E5%9C%B0%E5%9C%96%E5%B8%B6%E5%9B%9E%E5%8E%BB">總結：把這兩天的地圖帶回去</h1>
<ul>
<li><strong>架構</strong>：kubectl → API Server →（etcd / Scheduler / Controller-Manager）→ kubelet → CRI/CNI/CSI</li>
<li><strong>Workload</strong>：Deployment 管 ReplicaSet 管 Pod；物件之間靠 label selector 對應</li>
<li><strong>網路</strong>：Pod IP 會變 → Service 給穩定 IP + DNS 給名字 → Ingress 做 L7 分流</li>
<li><strong>儲存</strong>：PV/PVC 分工，StorageClass 自動供應</li>
<li><strong>資源</strong>：requests 決定排程、limits 決定上限、QoS 決定誰先被趕走、Probe 顧健康</li>
</ul>
<blockquote>
<p>下次除錯時，先想「這件事在架構圖的哪一站？」</p>
</blockquote>
